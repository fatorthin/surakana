<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6f3b24">
    <title>Surakana Offline</title>
    <style>
        :root {
            color-scheme: light;
            --canvas: #f8f3ec;
            --coffee: #4d2e21;
            --muted: #786557;
            --accent: #bd7947;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top left, rgba(189,121,71,0.24), transparent 36%), var(--canvas);
            font-family: system-ui, sans-serif;
            color: var(--coffee);
        }

        main {
            width: min(92vw, 34rem);
            padding: 2rem;
            border-radius: 2rem;
            background: rgba(255, 252, 247, 0.95);
            box-shadow: 0 25px 60px rgba(55, 30, 20, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 0.75rem;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        p {
            margin: 0;
            line-height: 1.7;
            color: var(--muted);
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.85rem 1.25rem;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>Kamu sedang offline.</h1>
        <p>Aplikasi tetap bisa dibuka untuk halaman yang sudah tersimpan. Saat koneksi kembali, muat ulang untuk sinkronisasi data terbaru.</p>
        <a href="/">Coba lagi</a>
    </main>
</body>
</html>
